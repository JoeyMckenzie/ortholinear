[package]
name = "ortholinear"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
anyhow = "1"
pulldown-cmark = "0.12"
nucleo-matcher = "0.3"
open = "5"

[dev-dependencies]
tempfile = "3"
